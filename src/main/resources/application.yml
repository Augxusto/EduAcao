spring:
  application:
    name: eduacao
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/eduacao}
      auto-index-creation: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
